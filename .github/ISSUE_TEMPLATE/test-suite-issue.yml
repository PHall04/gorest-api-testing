name: Test suite issue
description: A test behaves incorrectly when the API is working as documented
title: "[Test suite] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the GoREST API itself is behaving differently from its documentation, please report it to GoREST instead.
        Do NOT include your GoREST token anywhere in this issue.
  - type: input
    id: scenario
    attributes:
      label: Scenario name
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature file
      placeholder: i.e. users.feature
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used to run the tests
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the error message from the output
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why I believe the test is wrong
      placeholder: i.e. the API response matches the GoREST documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and shell
      placeholder: i.e. Windows 11, PowerShell
    validations:
      required: true